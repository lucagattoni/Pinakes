[project]
name = "pinakes"
version = "0.0.0"
description = "A portable, agent-first knowledge base. One directory = one KB."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Luca Gattoni" }]
keywords = ["knowledge-base", "rag", "retrieval", "mcp", "sqlite", "embeddings"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

# Core stays deliberately small: parsing, storage, search plumbing, MCP, CLI.
# Embedding backends are extras — torch is ~2GB and must not be forced on anyone.
dependencies = [
    "mcp>=1.28",
    "numpy>=2.0",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
st = ["sentence-transformers>=5.0"]      # default backend (§4.5 of docs/DESIGN.md)
light = ["fastembed>=0.8"]               # ONNX, ~100MB, no torch — what CI runs

[project.urls]
Homepage = "https://github.com/lucagattoni/KB"
Design = "https://github.com/lucagattoni/KB/blob/main/docs/DESIGN.md"

[project.scripts]
pnk = "pinakes.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pyright>=1.1.390", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinakes"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
