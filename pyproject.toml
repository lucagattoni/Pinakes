[project]
name = "pinakes"
dynamic = ["version"]
description = "A portable, agent-first knowledge base. One directory = one KB."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Luca Gattoni" }]
keywords = ["knowledge-base", "rag", "retrieval", "mcp", "sqlite", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

# Core stays deliberately small: parsing, storage, search plumbing, MCP, CLI.
# Embedding backends are extras — torch is ~2GB and must not be forced on anyone.
dependencies = [
    "jinja2>=3.1",
    "mcp>=1.28",
    "numpy>=2.0",
    "python-ulid>=3.0",
    "ruamel.yaml>=0.19",
]

[project.optional-dependencies]
st = ["sentence-transformers>=5.0"]      # default backend (§4.5 of docs/DESIGN.md)
light = ["fastembed>=0.8"]               # ONNX, ~100MB, no torch — what CI runs
pdf = ["pypdfium2>=5.12"]                 # free PDF extraction (§4.5)
claude = ["anthropic>=0.116", "pinakes[pdf]"]  # opt-in paid Claude-vision extractor; needs [pdf] too

[project.urls]
Homepage = "https://github.com/lucagattoni/pinakes"
Documentation = "https://lucagattoni.github.io/pinakes/"
Design = "https://github.com/lucagattoni/pinakes/blob/main/docs/DESIGN.md"

[project.scripts]
pnk = "pinakes.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.390",
    "ruff>=0.9",
    "ty>=0.0.63",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth: the version lives in the module, and the package inherits it. Two places
# to bump is one place to forget.
[tool.hatch.version]
path = "src/pinakes/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pinakes"]
# Templates are data, not code: they must travel inside the wheel, since `pnk init` reads them
# through importlib.resources rather than off the source tree.
artifacts = ["src/pinakes/templates/**"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The version archive is frozen bytes, and `ruff format` rewrites Python inside Markdown fences
# (measured; `check.sh` runs `ruff format --check .` over the whole repository). A template
# `README.md` that gains a fence would be reformatted in its archived copies too — the formatter
# editing a version that already shipped — and it would surface as a `_versions.toml` ledger
# mismatch in `tools/template_drift_gate.py`, one leg away from its cause. Latent while no template
# README has a fence; excluded now rather than after.
extend-exclude = ["src/pinakes/templates/*/_versions"]

[tool.ruff.lint]
# BLE: a bare `except Exception` around a call whose failure mode is known swallows real
# bugs — I2's retrospective caught two (docs/RETROSPECTIVES.md).
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
# A hand-authored stub names pdfium's own C API functions verbatim (`FPDFText_GetFontSize`), never
# a Python name this project chose — renaming it to satisfy N802 would make the stub describe a
# function that does not exist (I3b).
"stubs/*.pyi" = ["N802"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
# pypdfium2 ships no py.typed marker and no stubs of its own (verified against 5.12.1) — a local
# stub is the honest fix, not a suppression: it describes the real surface I2 calls (stubs/pypdfium2.pyi).
stubPath = "stubs"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings are errors: a DeprecationWarning printed in a summary nobody reads is how a project
# arrives at a Python upgrade it cannot take. (Caught `importlib.abc.Traversable` in I10.)
filterwarnings = ["error"]
markers = [
    # Needs real model weights. Skipped unless they are already cached, so a clean checkout is
    # never blocked on a download; CI caches HF_HOME and runs them for real.
    "model: exercises a real embedding or reranking model",
    # Needs pinakes[pdf] importable *and* tests/pdf-corpus present (I2). Never marks the
    # recorded-fixture suite, which must run with neither extra installed (ground rules).
    "pdf: needs pinakes[pdf] and its fixtures",
    # Makes a real, billed API call. Never CI: no job holds a key (ground rules, "CI never spends").
    "paid: makes a real Claude API call — needs anthropic, a key, and PINAKES_ALLOW_SPEND=1",
]
