name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Three legs (I1): the light-only core, [pdf] added, then [claude] added on top. Each is a
        # supported install state (docs/DESIGN.md §4.5) and each must pass this job on its own —
        # a matrix that stopped at [light] would prove nothing about the other two for six
        # increments, the exact gap I1's own exit criterion closes.
        extras: ["light", "light pdf", "light pdf claude"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        # The [light] extra, never [st]: a 2GB torch download per job is untenable, and fastembed
        # exercises the same protocols (docs/DESIGN.md §4.5). [pdf]/[claude] install one pure-Python
        # SDK apiece and never call them — this job proves the extra installs and imports cleanly,
        # not that the paid path works.
        run: |
          set -e
          args=""
          for extra in ${{ matrix.extras }}; do
            args="$args --extra $extra"
          done
          uv sync --frozen $args

      # Model weights are a download, not an install. Keyed on the models the demo KB names, so a
      # model change invalidates the cache and nothing else does. Without this the reranker alone
      # would pull ~1GB per job.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/demo-kb/pinakes.toml') }}
          restore-keys: hf-

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Types (ty, fast pre-check)
        run: uv run --frozen ty check --extra-search-path stubs .

      - name: Types (pyright, strict — the gate)
        run: uv run --frozen pyright

      - name: Tests
        # Warnings are errors here (pyproject), which is how a deprecation reaches a human.
        run: uv run --frozen pytest -q -rs

      - name: Model-backed tests
        # Pinned to the [light] leg alone (I1): `_runnable()` skips only when fastembed is absent or
        # the HF cache is empty, both true on every leg alike, so this dedicated step would triple
        # for no benefit on the other two. (The Tests step above already runs these once per leg too
        # when the cache is warm — this step's own redundancy predates the matrix and is unrelated.)
        if: matrix.extras == 'light'
        run: uv run --frozen pytest -q -m model

  eval:
    # The scoreboard §7 requires: a retrieval change has to move these numbers, and a regression
    # beyond tolerance fails the build rather than being noticed later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --extra light

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/demo-kb/pinakes.toml') }}
          restore-keys: hf-

      - name: Index the demo KB
        run: uv run --frozen pnk sync --kb tests/demo-kb

      - name: Health check
        run: uv run --frozen pnk doctor --kb tests/demo-kb

      - name: Golden-set evaluation against the baseline
        run: uv run --frozen python -m pinakes.eval tests/demo-kb

  pdf-eval:
    # I3b: joins CI in the same commit that adds the gate, not deferred until I9 the way the draft
    # plan would have left it for six intervening increments to land ungated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --extra light --extra pdf

      - name: Extraction-quality baseline + floor-drift check
        run: |
          uv run --frozen python -m pinakes.extract.quality tests/pdf-corpus \
            --check-floors src/pinakes/extract/floors.toml

  traversal-caps:
    # Its own job for the same reason link-density has one: `ci.yml` never invokes `check.sh`.
    # Needs no models, no index and no extras — the core has no dependencies at all, which is what
    # being pure buys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: A traversal cannot exceed its caps
        run: uv run --frozen python tools/traversal_cap_gate.py

  link-density:
    # Its own job because `ci.yml` never invokes `check.sh` — a gate that lives only there runs
    # only on the machine of whoever remembers to run it. Needs no models and no index (it reads
    # the committed sidecars), so it is the cheapest job here and runs on core alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Authored links in both corpora stay sparse
        run: uv run --frozen python tools/link_density_gate.py

      - name: The gate can still fail
        # A gate nobody has watched fail is a gate nobody knows works. Drives the same artifact at
        # an impossible threshold and asserts a non-zero exit AND the stated reason: a crash, a
        # missing corpus, or `uv` itself falling over all satisfy a bare non-zero exit too.
        run: |
          if uv run --frozen python tools/link_density_gate.py --max-degree 0; then
            echo "link-density passed at --max-degree 0 — the gate is not gating" >&2
            exit 1
          fi
          uv run --frozen python tools/link_density_gate.py --max-degree 0 2>&1 \
            | grep -q "above the degree cap of 0"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the wheel and sdist
        run: uv build

      # Proves the templates travel inside the wheel. `pnk init` reads them through
      # importlib.resources, so a packaging mistake is invisible until someone installs it.
      - name: Smoke-test the built wheel
        run: |
          set -e
          uv run --isolated --no-project --with dist/*.whl pnk --version
          mkdir -p /tmp/smoke
          uv run --isolated --no-project --with dist/*.whl pnk init /tmp/smoke/kb
          test -f /tmp/smoke/kb/pinakes.toml
          test -f /tmp/smoke/kb/eval/questions.yaml
          grep -q '.pinakes/' /tmp/smoke/kb/.gitignore

      # `floors.toml` and `prices.toml` are the two package-data files whose absence silently
      # disables a spending guard: a source-tree test finds them by path and passes on every
      # installed copy that does not have them. Asserted here through `importlib.resources`,
      # against the built wheel, because that is the only place the question is real.
      - name: The wheel carries the files the spending guards read
        run: |
          set -e
          uv run --isolated --no-project --with dist/*.whl python -c "
          from pinakes.budget.prices import load_prices
          from pinakes.extract.floors import load_floors
          prices, floors = load_prices(), load_floors()
          assert prices.models, 'prices.toml reached the wheel with no models in it'
          assert floors.text_yield_floor > 0, 'floors.toml reached the wheel with no fitted floor'
          print(f'prices as_of {prices.as_of}; text-yield floor {floors.text_yield_floor}')
          "

      # A core-only install can index nothing that needs embeddings and no PDF at all. Both are
      # expected, and both must fail by *naming the extra to install* rather than with a traceback.
      #
      # **`pnk sync` cannot make the extractor half of that claim, and the obvious version of this
      # step silently makes the wrong one.** The embedding backend loads before any extractor runs,
      # so a PDF-only KB still fails on sentence-transformers and names `pinakes[st]` — a grep for
      # `pinakes[` passes while proving nothing about PDFs. Verified by running it (I9). `pnk
      # doctor` is the surface that reaches the extractor question, because it reports a failing
      # backend as a check and carries on, so both assertions below are real ones.
      - name: A core-only install names the extra it needs, and never traces back
        run: |
          set -e
          uv run --isolated --no-project --with dist/*.whl pnk init /tmp/smoke/corekb --name core
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("/tmp/smoke/corekb/pinakes.toml")
          body = manifest.read_text(encoding="utf-8")
          include = 'include = ["**/*.md", "**/*.txt"]'
          assert include in body, "the template's include line has changed shape"
          manifest.write_text(body.replace(include, 'include = ["**/*.pdf"]'), encoding="utf-8")
          PY
          cp tests/pdf-corpus/baseline-1p.pdf /tmp/smoke/corekb/docs/a.pdf

          # (a) the embedding half: a clean, named refusal, not a stack trace.
          set +e
          out=$(uv run --isolated --no-project --with dist/*.whl pnk sync --kb /tmp/smoke/corekb 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then echo "::error::a core-only install must not report success"; exit 1; fi
          echo "$out" | grep -q 'pinakes\[st\]' || { echo "::error::it must name the embedding extra"; exit 1; }
          if echo "$out" | grep -qi 'traceback'; then echo "::error::it must not be a traceback"; exit 1; fi

          # (b) the extractor half, which only `doctor` reaches on a core-only install.
          set +e
          health=$(uv run --isolated --no-project --with dist/*.whl pnk doctor --kb /tmp/smoke/corekb 2>&1)
          set -e
          echo "$health"
          echo "$health" | grep -q 'pinakes\[pdf\]' || { echo "::error::doctor must name the PDF extra"; exit 1; }
          if echo "$health" | grep -qi 'traceback'; then echo "::error::doctor must not trace back"; exit 1; fi

      # plans/v0.1.md promised this gate under "Verification of the whole" and it never shipped:
      # the item carried no increment number, so no increment owned it (see that plan's close-out,
      # rule 8). I7a replaces the unconditional grep that stood here with the allowlist gate: an
      # unconditional grep admits no exceptions, so it would have turned main red on every commit
      # from I7b — which adds `import anthropic` to the one module permitted to have it — until
      # someone noticed. The permitted paths live in .paid-path-allowlist, which this script,
      # check.sh and tests/test_paid_path.py all read, so three copies cannot drift.
      #
      # Stdlib-only and importing nothing from this project, so it runs in the build job without
      # installing the package.
      - name: The free path stays free — no paid-API client imported in src/
        run: python3 tools/paid_path_gate.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
