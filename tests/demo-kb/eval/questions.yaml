# Golden set for the synthetic demo KB (docs/DESIGN.md §7).
#
# Five kinds, deliberately:
#   lexical    — the answer shares words with the question; BM25 alone should find it
#   paraphrase — no meaningful word overlap; only the dense half can find it
#   filter     — needs a metadata filter to be answerable precisely
#   multi-hop  — the answer needs two retrievals, scripted here as `hops`
#   no-answer  — nothing in the corpus answers it, and abstaining is the correct behaviour
#
# `expect` lists the documents that *should* be retrieved. A no-answer question has none: it scores
# by whether the system abstains, which is why the corpus has to contain plausible near-misses.

questions:
  # --- lexical --------------------------------------------------------------------------------
  - question: How long do items stay in quarantine?
    kind: lexical
    expect: [docs/accession-workflow.md]
  - question: What temperature and humidity are the stacks held at?
    kind: lexical
    expect: [docs/storage-environment.md]
  - question: What resolution are master images captured at?
    kind: lexical
    expect: [docs/digitisation-standards.md]
  - question: How often is fixity checked?
    kind: lexical
    expect: [docs/digital-preservation.md]
  - question: What is the format of a catalogue number?
    kind: lexical
    expect: [docs/catalogue-numbers-format.md]
  - question: When is the reading room open?
    kind: lexical
    expect: [docs/opening-hours.md]
  - question: How often does the acquisitions committee meet?
    kind: lexical
    expect: [docs/acquisitions-committee.md]
  - question: How often are pest traps checked?
    kind: lexical
    expect: [docs/pest-management.md]
  - question: What are the levels of catalogue description?
    kind: lexical
    expect: [docs/catalogue-hierarchy.md]
  - question: How long does reader registration last?
    kind: lexical
    expect: [docs/reader-registration.md]
  - question: What does a conservation assessment record?
    kind: lexical
    expect: [docs/conservation-assessment.md]
  - question: When was the reading room added?
    kind: lexical
    expect: [docs/building-history.md]

  # --- paraphrase -----------------------------------------------------------------------------
  - question: Why can a number never be handed to a different object later?
    kind: paraphrase
    expect: [docs/catalogue-policy.md]
  - question: Why keep a copy somewhere that is not connected to anything?
    kind: paraphrase
    expect: [docs/digital-preservation.md]
  - question: Why is a steady climate better than hitting the ideal figure sometimes?
    kind: paraphrase
    expect: [docs/storage-environment.md]
  - question: Why should a summary of what a thing is about never be left out?
    kind: paraphrase
    expect: [docs/metadata-minimum.md]
  - question: What happens to something too fragile to stand on a shelf?
    kind: paraphrase
    expect: [docs/conservation-assessment.md]
  - question: Why is putting something in a freezer only a delaying tactic?
    kind: paraphrase
    expect: [docs/emergency-plan.md]
  - question: Why is it wrong to hide an entire folder because one sheet is sensitive?
    kind: paraphrase
    expect: [docs/access-restrictions.md]
  - question: Why must a duplicate of a page carry its reference?
    kind: paraphrase
    expect: [docs/copying-service.md]
  - question: Why is being interesting not enough to keep something?
    kind: paraphrase
    expect: [docs/appraisal-criteria.md]
  - question: Why record a trap count when nothing was caught?
    kind: paraphrase
    expect: [docs/pest-management.md]
  - question: Why not let a restriction run forever?
    kind: paraphrase
    expect: [docs/donor-agreements.md, docs/access-restrictions.md]
  - question: Why does the old building keep its climate without machinery?
    kind: paraphrase
    expect: [docs/building-history.md]

  # --- filter ---------------------------------------------------------------------------------
  - question: What are the rules for lending material out?
    kind: filter
    expect: [docs/loans-outward.md]
    filters: {path_prefix: docs/loans-}
  - question: What happens to material coming in on loan?
    kind: filter
    expect: [docs/loans-inward.md]
    filters: {path_prefix: docs/loans-}
  - question: Who is responsible for signing off a withdrawal?
    kind: filter
    expect: [docs/staff-keeper.md, docs/deaccession-policy.md]
    filters: {path_prefix: docs/staff-}
  - question: Which role responds to an environmental alert?
    kind: filter
    expect: [docs/staff-conservator.md]
    filters: {path_prefix: docs/staff-}

  # --- multi-hop ------------------------------------------------------------------------------
  # Scripted, so they are scoreable without an agent: each hop is a query, and the hop before it
  # names the document a reader would have had to read to ask the next question.
  - question: Why may material bought with the public grant not be sold?
    kind: multi-hop
    expect: [docs/funding-sources.md]
    hops:
      - query: What may not be done with material acquired using public money?
        expect: docs/deaccession-policy.md
      - query: Where does the Institute's core funding come from?
        expect: docs/funding-sources.md
  - question: Who decides on an offer that comes with a fifteen-year embargo?
    kind: multi-hop
    expect: [docs/acquisitions-committee.md]
    hops:
      - query: What does a donor agreement say about embargoes?
        expect: docs/donor-agreements.md
      - query: Which body refers long embargoes to the trustees?
        expect: docs/acquisitions-committee.md
  - question: Who can stop a digitisation session, and why would they?
    kind: multi-hop
    expect: [docs/staff-conservator.md]
    hops:
      - query: What outranks everything else in the conservation queue?
        expect: docs/conservation-assessment.md
      - query: Who may halt a process touching an item in active deterioration?
        expect: docs/staff-conservator.md
  - question: Why did the conservation backlog shorten in 2025?
    kind: multi-hop
    expect: [docs/annual-report-2025.md]
    hops:
      - query: What happened to the conservation backlog last year?
        expect: docs/annual-report-2025.md
      - query: What is done instead of rebinding for brittle paper?
        expect: docs/conservation-assessment.md
  - question: What must a borrower provide before an item can travel?
    kind: multi-hop
    expect: [docs/loans-outward.md]
    hops:
      - query: What is required from a borrower before a loan?
        expect: docs/loans-outward.md
      - query: What environment does the Institute hold its own stacks at?
        expect: docs/storage-environment.md

  # --- no-answer ------------------------------------------------------------------------------
  # Every one of these is close enough to the corpus to be plausible. Abstaining is correct.
  - question: What is the Institute's parking policy?
    kind: no-answer
    expect: []
  - question: How much does a reader's ticket cost?
    kind: no-answer
    expect: []
  - question: Which software does the catalogue run on?
    kind: no-answer
    expect: []
  - question: What is the salary of the keeper?
    kind: no-answer
    expect: []
  - question: How many staff does the Institute employ?
    kind: no-answer
    expect: []
  - question: What is the wifi password for the reading room?
    kind: no-answer
    expect: []
  - question: Which bus routes stop outside the building?
    kind: no-answer
    expect: []
  - question: What is the Institute's policy on photography by drone?
    kind: no-answer
    expect: []
