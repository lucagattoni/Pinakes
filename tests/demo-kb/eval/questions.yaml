# Golden set for the synthetic demo KB (docs/DESIGN.md §7).
#
# Six kinds, deliberately:
#   lexical       — the answer shares words with the question; BM25 alone should find it
#   simple-lookup — an ordinary factual question, phrased the way a reader would ask it
#   paraphrase    — no meaningful word overlap; only the dense half can find it
#   filter        — needs a metadata filter to be answerable precisely
#   multi-hop     — the answer needs two retrievals, scripted here as `hops`
#   no-answer     — nothing in the corpus answers it, and abstaining is the correct behaviour
#
# `simple-lookup` is the *control* class (PINAKES_APPROACH §9). One study in the GraphRAG-Bench
# line measured a graph channel costing ~13% accuracy on plain factual lookup while helping
# multi-hop, and an aggregate hides that trade exactly. These questions are therefore not authored
# to be hard, and not authored to share words with their document the way `lexical` is: they are
# authored to be *normal*, so that a change paying for multi-hop out of ordinary retrieval shows up
# as a per-class drop instead of a rounding error.
#
# `id` is what pairs a before row with an after row in `eval/outcomes.json`. It is stable and
# hand-written: the loader will derive one from the question text when it is absent, but a derived
# id moves the moment the wording does, which silently drops the question from every comparison.
# Never reuse an id for a different question, and never renumber.
#
# `expect` lists the documents that *should* be retrieved. A no-answer question has none: it scores
# by whether the system abstains, which is why the corpus has to contain plausible near-misses.

questions:
