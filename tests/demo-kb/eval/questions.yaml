  # --- multi-hop ------------------------------------------------------------------------------
  # Scripted, so they are scoreable without an agent: each hop is a query, and the hop before it
  # names the document a reader would have had to read to ask the next question.
  #
  # `expect` is the union of the hops' own documents, and a hit requires EVERY hop to land its
  # document by its own query — the whole point of the class. Until 20260729 it named one document
  # and the scorer ignored `hops` entirely, so two of these five asked about one document and
  # demanded another, and the class measured single-shot retrieval of the last hop's query.
  #
  # The thirteen added in G2 are authored from corpus *structure*: a pair of documents that between
  # them answer one question and share no vocabulary on the thing that joins them, with the second
  # hop phrased in the first document's words — which is how a reader would actually ask it, and
  # why the second hop is the one that can miss. They were authored once, before the reachability
  # probe was run, and are not re-authored on the strength of what it reported: fitting the question
  # set to the edge set is the circularity decision 14 removed by cutting cross-KB questions, and it
  # would be undetectable afterwards.
  - id: mh-public-grant-sale
    question: Why may material bought with the public grant not be sold?
    kind: multi-hop
    expect: [docs/deaccession-policy.md, docs/funding-sources.md]
    hops:
      - query: What may not be done with material acquired using public money?
        expect: docs/deaccession-policy.md
      - query: Where does the Institute's core funding come from?
        expect: docs/funding-sources.md
  - id: mh-fifteen-year-embargo
