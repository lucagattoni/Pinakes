# Golden set for the RFC realism corpus — frozen 20260806.
#
# The corpus is not in this repository and never will be: `tools/build_rfc_corpus.py` regenerates
# it from a recorded band (`--era modern --count 200`, RFCs 8600-8799, 195 published). These
# questions are authored, not harvested, so they *are* committed — they are the instrument, and an
# instrument that lives on one machine cannot be re-run. `build_rfc_corpus.py` copies this file
# into `<out>/eval/questions.yaml`, so `python -m pinakes.eval <out>` finds it with no flags.
#
# ## How it was authored, and why that matters more than usual
#
# **Written before any injection code existed, by authors blind to the hypothesis.** Four agents
# each took a disjoint 50-document slice, were told only that they were writing an evaluation set
# for a retrieval system, and were forbidden from reading this repository — where the plan would
# have told them what the questions were going to measure. Nobody who authored a question knew
# which mechanism it would later be used to test.
#
# That is not politeness. Fitting a question set to the mechanism it is meant to judge is the
# circularity this project cut once already (STATUS: "fitting the question set to the edge set is
# the circularity that cutting cross-KB questions removed once already, and it is undetectable
# afterwards"). Blind authorship is the only form of that guarantee that survives review, because
# no amount of care by an author who knows the hypothesis is checkable from the outside.
#
# **Frozen means frozen.** Never reword a question, never renumber an id, never change an `expect`
# to make a result look better. `id` is what pairs a before row with an after row; a reworded
# question is silently a different question. Adding questions later is legitimate and must be
# recorded with its date and reason; editing one is not.
#
# **Grown once, 20260806, from 70 questions to 110 — and the reason matters more than the fact.**
# The first 70 produced an improvable pool of **9** at baseline: 51 of 60 answerable questions were
# already at rank 1, and the plan requires at least 10 to reach `sign_test` at p < 0.05. The pool
# was 8 paraphrase and 1 lexical, because lexical and simple-lookup both scored **1.00** — on a
# corpus of distinctive technical vocabulary, BM25 with a reranker essentially solves them.
#
# The fast way to a pool of 10 was therefore to author more paraphrase questions, and that is
# exactly what was not done. Low-word-overlap questions are the ones a change to the *embedded*
# text is most likely to move, so enriching the set with them would fit the instrument to the
# hypothesis one step removed — passing the criterion while destroying the meaning of the result.
# The two new slices carry the **same proportional mix** as the first four (6 lexical, 6
# simple-lookup, 6 paraphrase, 2 no-answer each), over 135 documents no question had touched, and
# were authored by agents who did not know a pool had fallen short, which class was short, or that
# any hypothesis existed.
#
# ## `evidence` — the field that makes `expect` checkable
#
# Every answerable question carries the sentence from its expected document that answers it,
# copied verbatim. `pinakes.eval` ignores the key; `tools/verify_rfc_golden_set.py` checks it.
#
# A wrong `expect` is the expensive error in a set like this, because it is **self-concealing**: it
# looks exactly like a retrieval miss, so it inflates the improvable pool and makes a power
# criterion pass for the wrong reason. `evidence` converts that into something a grep can refute.
# RFC bodies are hard-wrapped at ~72 columns, so a sentence often spans two lines and the recorded
# evidence is the fragment on one line; the check normalises whitespace and matches a substring.
#
# ## The four kinds, and the two that are deliberately absent
#
#   lexical       — the answer shares distinctive words with the question; BM25 alone should find it
#   simple-lookup — an ordinary factual question, phrased the way an engineer would ask it. The
#                   *control* class: not authored to be hard, so a change that buys one class out
#                   of ordinary retrieval shows as a per-class drop instead of a rounding error
#   paraphrase    — almost no word overlap with the document; only the dense half can find it
#   no-answer     — nothing in the corpus answers it, and abstaining is the correct behaviour
#
# **`filter` and `multi-hop` are absent, by decision.** `filter` needs metadata worth filtering on
# and these sidecars carry a title and nothing else. `multi-hop` is the graph channel's class and
# `graph_channel` is `off` for this corpus, so every such question would score as an ordinary
# lookup while claiming to measure something else.
#
# **The no-answer questions are load-bearing twice over.** `calibrate.py` fits both confidence
# thresholds against *their* scores, "because those are the ones whose correct outcome is known
# absolutely" — a set without them cannot be calibrated at all. Each was checked absent across all
# 195 documents, not merely across its author's slice. Three have near-miss lexical collisions and
# were kept for it: "camel case" in rfc8618 for the CAMEL question, one mention of blockchain
# databases in rfc8673, Bluetooth as a transport example in rfc8628 and rfc8793. None answers its
# question, and a plausible near-miss is exactly what a calibration set needs.
